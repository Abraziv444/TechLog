<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F171B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TechLog — учёт работ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="./styles.css">
<!-- ПК-режим: правила действуют ТОЛЬКО при классе tl-desktop на <html>.
     Без него файл инертен — мобильная версия его не видит. -->
<link rel="stylesheet" href="./desktop.css">
<script src="./config.js"></script>
<!-- Переключатель «Телефон | Компьютер». Автономный: не зависит от app.js,
     при любой ошибке приложение остаётся обычной мобильной версией. -->
<script src="./viewmode.js"></script>
<!-- Колонка сотрудников для ПК-режима. Тоже автономная надстройка:
     пользуется только публичными ручками App.* и кэшем localStorage. -->
<script src="./desktop.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<div id="app" aria-live="polite">
  <div class="login-wrap boot-splash"><div class="logo"><span>TL</span></div>
  <div class="hello">TechLog</div><div class="tiny">загрузка…</div></div>
</div>
<div id="toasts"></div>
<noscript>TechLog требует включённый JavaScript. / TechLog requires JavaScript.</noscript>
<script>
/* Сторож загрузки: если приложение не стартовало за 6 секунд — показывает диагностику.
   Работает даже когда app.js вообще не загрузился (никаких зависимостей). */
(function(){
  window.__tlErr = null;
  addEventListener('error', function(e){
    window.__tlErr = (e.message||'script error') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
  }, true);
  addEventListener('unhandledrejection', function(e){
    var r = e.reason; window.__tlErr = 'Promise: ' + (r && (r.message || r) || '?');
  });
  window.__tlReset = async function(){
    try{ var regs = await navigator.serviceWorker.getRegistrations(); for (var i=0;i<regs.length;i++) await regs[i].unregister(); }catch(e){}
    try{ var ks = await caches.keys(); for (var j=0;j<ks.length;j++) await caches.delete(ks[j]); }catch(e){}
    try{ localStorage.removeItem('techlog_draft'); }catch(e){}
    location.reload();
  };
  window.__tlPanic = async function(extra){
    var app = document.getElementById('app');
    var lines = [];
    if (extra) lines.push(extra);
    if (window.__tlErr) lines.push('⛔ ' + window.__tlErr);
    lines.push('config.js: ' + (window.TECHLOG_CONFIG ? 'ок' : 'НЕ загружен (синтаксис?)'));
    lines.push('supabase-js: ' + (window.supabase ? 'ок' : 'НЕ загружен (CDN/интернет)'));
    try{ var a = await fetch('./app.js', {method:'HEAD', cache:'no-store'}); lines.push('app.js: HTTP ' + a.status); }
    catch(e){ lines.push('app.js: недоступен'); }
    try{ var r = await fetch('./version.json?ts=' + Date.now(), {cache:'no-store'}); var v = await r.json(); lines.push('на сервере версия: ' + v.version); }
    catch(e){ lines.push('version.json: недоступен'); }
    app.innerHTML = '<div class="login-wrap">' +
      '<div class="logo"><span>TL</span></div>' +
      '<div class="hello">Не удалось запустить</div>' +
      '<div class="tiny" style="text-align:left;white-space:pre-line;background:#17232A;border:2px solid #31434C;border-radius:12px;padding:10px 12px;margin-top:10px">' + lines.join('\n') + '</div>' +
      '<button class="btn btn-red" style="margin-top:14px" onclick="__tlReset()">Сбросить кеш и перезагрузить</button>' +
      '<button class="btn btn-ghost" style="margin-top:8px" onclick="location.reload()">Просто обновить</button></div>';
  };
  setTimeout(function(){
    var app = document.getElementById('app');
    if (app && app.querySelector('.boot-splash')) window.__tlPanic(null);
  }, 6000);
})();
</script>
</body>
</html>
